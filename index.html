<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOTP Generator</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f4f5; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  main { background: #fff; width: min(420px, 90%); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px #0001; box-sizing: border-box; }
  h1 { margin-top: 0; font-size: 24px; }
  label { display: block; margin-bottom: 8px; font-weight: 600; }
  input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font: 15px monospace; }
  #code { text-align: center; font: bold 42px monospace; letter-spacing: 6px; margin: 25px 0 10px; }
  #status { text-align: center; color: #666; }
  #status.error { color: #dc2626; }
  .note { margin: 20px 0 0; padding: 10px; background: #fff7ed; border-radius: 6px; color: #9a3412; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>TOTP Generator</h1>
  <label for="secret">TOTP Secret</label>
  <input id="secret" type="password" placeholder="Enter Base32 secret" autocomplete="off" spellcheck="false">
  <div id="code">------</div>
  <div id="status">Enter your secret</div>
  <p class="note">Your secret is processed entirely in this browser. It is not sent to a server by this page.</p>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);

function base32ToBytes(s) {
  const bytes = [];
  let buf = 0, bits = 0;
  for (const c of s.toUpperCase().replace(/[\s=-]/g, "")) {
    const v = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567".indexOf(c);
    if (v < 0) throw new Error("Invalid Base32 secret.");
    buf = ((buf << 5) | v) & 0xfff; bits += 5;
    if (bits >= 8) bytes.push((buf >> (bits -= 8)) & 0xff);
  }
  if (!bytes.length) throw new Error("Secret is too short.");
  return new Uint8Array(bytes);
}

// RFC 6238 defaults: SHA-1, 6 digits, 30-second step
async function totp(secret, now = Date.now()) {
  const counter = new DataView(new ArrayBuffer(8));
  counter.setBigUint64(0, BigInt(Math.floor(now / 30000)));
  const key = await crypto.subtle.importKey("raw", base32ToBytes(secret), { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
  const h = new DataView(await crypto.subtle.sign("HMAC", key, counter));
  const offset = h.getUint8(h.byteLength - 1) & 0xf;
  return String((h.getUint32(offset) & 0x7fffffff) % 1e6).padStart(6, "0");
}

async function update() {
  const secret = $("secret").value.trim(), status = $("status");
  status.className = "";
  try {
    $("code").textContent = secret ? await totp(secret) : "------";
    const s = 30 - Math.floor(Date.now() / 1000) % 30;
    status.textContent = secret ? `Refreshes in ${s} second${s === 1 ? "" : "s"}` : "Enter your secret";
  } catch (e) {
    $("code").textContent = "------";
    status.textContent = e.message;
    status.className = "error";
  }
}

$("secret").addEventListener("input", update);
setInterval(update, 1000);
</script>
</body>
</html>
